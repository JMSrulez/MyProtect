services:
  myprotect:
    build: .
    image: myprotect:local
    restart: unless-stopped
    init: true
    user: "${MYPROTECT_UID:?Run configure_server}:${MYPROTECT_GID:?Run configure_server}"
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:8443:8443"
    environment:
      PROTECT_URL: "${PROTECT_URL:?Set PROTECT_URL}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:?Set MCP_PUBLIC_URL}"
      PROTECT_CAMERA_IDS: "${PROTECT_CAMERA_IDS:-}"
      PROTECT_API_KEY_FILE: /run/secrets/protect_api_key
      MCP_TOKEN_FILE: /run/secrets/mcp_token
      PROTECT_CA_FILE: /run/secrets/protect_ca
      MCP_TLS_CERT_FILE: /run/secrets/mcp_tls_cert
      MCP_TLS_KEY_FILE: /run/secrets/mcp_tls_key
      DATA_DIR: /data
      EVENT_RETENTION_DAYS: "7"
      EVENT_MAX_ROWS: "10000"
      MEDIA_TTL_SECONDS: "3600"
      MEDIA_MAX_BYTES: "268435456"
      REQUESTS_PER_MINUTE: "60"
    secrets:
      - protect_api_key
      - mcp_token
      - protect_ca
      - mcp_tls_cert
      - mcp_tls_key
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

secrets:
  protect_api_key:
    file: ./.secrets/protect_api_key
  mcp_token:
    file: ./.secrets/mcp_token
  protect_ca:
    file: ./.secrets/protect_ca.pem
  mcp_tls_cert:
    file: ./.secrets/mcp-server.crt
  mcp_tls_key:
    file: ./.secrets/mcp-server.key